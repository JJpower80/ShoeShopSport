<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Logo 3S mejorado">
  <title>Logo ShoesShopSport - 3S</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="none" />
  <!-- Fondo circular suave -->
  <circle cx="100" cy="98" r="76" fill="#fff" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Curvas estilizadas formando tres S entrelazadas -->
  <g transform="translate(0,-6)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M48 62 C78 20,122 20,152 62" stroke="#0b1220" stroke-width="6" opacity="0.95"/>
    <path d="M48 96 C78 58,122 58,152 96" stroke="url(#g1)" stroke-width="8" opacity="0.95"/>
    <path d="M48 130 C78 92,122 92,152 130" stroke="#0b1220" stroke-width="6" opacity="0.95"/>
  </g>

  <!-- Centro: una S más sólida para equilibrio visual -->
  <path d="M88 64 C96 50,114 50,122 64 C112 70,96 78,88 94" fill="#0b1220" opacity="0.06"/>

  <!-- Texto debajo (más visible para el header) -->
  <text x="100" y="184" text-anchor="middle" font-family="Play, sans-serif" font-size="18" font-weight="700" fill="#0b1220">ShoeShopSport</text>
</svg>
